[build]
builder = "nixpacks"
# Pre-download the local embedding model so it's baked into the image.
# Only runs when EMBED_PROVIDER=local; harmless (cached) otherwise.
buildCommand = "python -c \"from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-base-en-v1.5')\" || true"

[deploy]
startCommand = "PYTHONPATH=/app/src uvicorn truebrief.api.server:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
