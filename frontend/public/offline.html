<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TrueBrief — offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0B0F1A; color: #E5E7EB;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .card { max-width: 320px; }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
    h1 { font-size: 18px; margin: 0 0 8px; font-weight: 600; }
    p { font-size: 14px; color: #9CA3AF; line-height: 1.6; margin: 0 0 20px; }
    button {
      font-size: 14px; font-weight: 600; color: #fff; background: #4B52E2;
      border: none; border-radius: 10px; padding: 10px 22px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="TrueBrief" />
    <h1>You're offline</h1>
    <p>TrueBrief needs a connection to fetch what's new. Your briefs will be waiting.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
